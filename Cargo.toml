[workspace]
resolver = "2"
members = [
    "crates/themis-core",
    "crates/themis-openapi",
    "crates/themis-protobuf",
    "crates/themis-graphql",
    "crates/themis-asyncapi",
    "crates/themis-lint",
    "crates/themis-compat",
    "crates/themis-codegen",
    "crates/themis-cli",
    "crates/themis-artifact",
    "crates/themis-registry",
    "crates/themis-sdk",
    "crates/themis-integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/A-Somniatore/themis"
rust-version = "1.75"

[workspace.dependencies]
# Shared platform types (from private somniatore registry)
themis-platform-types = { version = "0.2.0", registry = "somniatore" }

# Core dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# OpenAPI parsing
openapiv3 = "2.0"
indexmap = { version = "2.0", features = ["serde"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Testing
proptest = "1.0"
tempfile = "3.15"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
url = "2.5"

# Filesystem
dirs = "5.0"

# Hashing
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# Workspace crates
themis-core = { path = "crates/themis-core" }
themis-openapi = { path = "crates/themis-openapi" }
themis-protobuf = { path = "crates/themis-protobuf" }
themis-graphql = { path = "crates/themis-graphql" }
themis-asyncapi = { path = "crates/themis-asyncapi" }
themis-lint = { path = "crates/themis-lint" }
themis-compat = { path = "crates/themis-compat" }
themis-codegen = { path = "crates/themis-codegen" }
themis-artifact = { path = "crates/themis-artifact" }
themis-registry = { path = "crates/themis-registry" }
themis-sdk = { path = "crates/themis-sdk" }

# Protobuf parsing
prost-types = "0.13"
protobuf-parse = "3.4"
protobuf = "3.4"

# GraphQL parsing
graphql-parser = "0.4"

# AsyncAPI parsing (uses serde for YAML/JSON)
# AsyncAPI doesn't have a dedicated parser, we use serde_yaml

# Case conversion
heck = "0.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[profile.release]
lto = true
codegen-units = 1
