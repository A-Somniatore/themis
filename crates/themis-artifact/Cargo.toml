[package]
name = "themis-artifact"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Contract artifact creation and loading for Themis"
repository = "https://github.com/somniatore/themis"
keywords = ["api", "contract", "artifact", "governance"]

[dependencies]
themis-core = { path = "../themis-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.16"
